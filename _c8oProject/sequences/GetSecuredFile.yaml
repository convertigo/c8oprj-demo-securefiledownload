comment: Sert un fichier du répertoire secured uniquement après vérification du contexte authentifié.
↓ResolveSecuredFile [steps.SimpleStep-1792149226113]: 
  comment: Résout le fichier depuis context.getProjectDirectory() et vérifie qu’il reste directement dans secured/.
  expression: |
    'var requestedFile = String(file || '''');
    if (!/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(requestedFile) || requestedFile.indexOf(''..'') !== -1) {
      throw new Error(''Invalid file name'');
    }
    
    var securedDirectory = new java.io.File(context.getProjectDirectory(), ''secured'').getCanonicalFile();
    var requestedPath = new java.io.File(securedDirectory, requestedFile).getCanonicalFile();
    if (!requestedPath.getParentFile().equals(securedDirectory) || !requestedPath.isFile()) {
      throw new Error(''Requested file not found'');
    }
    
    var securedFilePath = requestedPath.getPath();
    var securedFileName = requestedPath.getName();'
